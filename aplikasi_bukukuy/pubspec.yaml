name: aplikasi_bukukuy
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8
  http: ^1.6.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo_1024.png"
  min_sdk_android: 21 
  web:
    generate: true
    image_path: "assets/logo_1024.png"
  windows:
    generate: true
    image_path: "assets/logo_1024.png"
    icon_size: 48 
  macos:
    generate: true
    image_path: "assets/logo_1024.png"

flutter:
  uses-material-design: true
  assets:
    - assets/logo_1024.png

flutter_native_splash:
  color: "#17124F"
  image: assets/logo_splash.png

  android_12:
    color: "#17124F"
    image: assets/logo_splash.png
  
